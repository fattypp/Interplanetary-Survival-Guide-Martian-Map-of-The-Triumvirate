name: check
on: [push, pull_request]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Python syntax
        run: python -m compileall -q jezero-delta-atlas
      - name: Rebuild dist and make sure it is committed
        run: |
          python jezero-delta-atlas/integration/web_bridge.py bundle
          git diff --exit-code jezero-delta-atlas/dist

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: JavaScript tests (link.test.js is browser-only and is skipped)
        run: |
          status=0
          for t in tests/*.test.js; do
            [ "$t" = tests/link.test.js ] && continue
            echo "::group::$t"
            node "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
