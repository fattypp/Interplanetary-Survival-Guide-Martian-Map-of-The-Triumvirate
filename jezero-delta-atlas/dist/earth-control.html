<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earth Mission Control</title>
<style>
:root{--bg:#0f1318;--panel:#192029;--line:#2c3744;--fg:#e6edf3;--mute:#93a1b0;--danger:#e5484d;--danger-d:#b82d32;--ok:#46b37a;--accent:#5ec8d8;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
.eh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:20px max(16px,4vw);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;letter-spacing:.04em}
.sub{margin:2px 0 0;color:var(--mute);font-size:13px}
.conn{font:13px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px}
.empty{color:var(--mute)}
.banner{background:var(--danger);color:#fff;border-radius:14px;padding:18px 20px;font-size:22px;font-weight:700;box-shadow:0 0 0 4px rgba(229,72,77,.35);animation:pulse 1.6s ease-in-out infinite}
.banner small{display:block;font-size:14px;font-weight:400;margin-top:4px;opacity:.95}
.banner[hidden]{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(229,72,77,.15)}}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alert{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--danger);border-radius:12px;padding:14px 16px}
.alert.acked{border-left-color:var(--ok)}
.alert h3{margin:0 0 4px;font-size:18px}
.alert .meta{font:13px var(--mono);color:var(--mute)}
.status{display:inline-block;font:700 12px var(--mono);letter-spacing:.08em;margin-right:8px;color:var(--danger)}
.acked .status{color:var(--ok)}
.alert button{margin-top:10px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 14px var(--font);cursor:pointer}
.alert button:hover{background:rgba(94,200,216,.12)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.banner{animation:none}}
.cols{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
.cols+*{margin:0}
#banner{max-width:1100px;margin:16px auto 0;width:calc(100% - 32px)}
.cbadge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/18px var(--font);text-align:center;letter-spacing:0;vertical-align:middle}
.cbadge[hidden]{display:none}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

.wide{grid-column:1/-1;order:3}
.reports{display:grid;gap:8px}
.report{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.report.fresh{border-left:6px solid var(--accent)}
.report summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.rsub{font-weight:700}
.rmeta{font:13px var(--mono);color:var(--mute)}
.rbody{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 var(--mono)}
.report summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:640px){.eh{padding-top:46px}}

</style>
<style>
/* link-ui.css: room join dialog and status chip (js/link-ui.js). Self-contained dark panel that works on light and dark pages. */
.lu-root{--lu-bg:#141a21;--lu-panel:#1b232d;--lu-line:#34424f;--lu-fg:#e8eef4;--lu-mute:#9aa8b6;--lu-accent:#5ec8d8;--lu-ok:#46b37a;--lu-bad:#ff7b80;--lu-font:system-ui,-apple-system,'Segoe UI',sans-serif;--lu-mono:ui-monospace,Menlo,Consolas,monospace;font-family:var(--lu-font)}
.lu-root *{box-sizing:border-box}
.lu-root [hidden]{display:none!important}

.lu-back{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,9,12,.78)}
.lu-dlg{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--lu-panel);color:var(--lu-fg);border:1px solid var(--lu-line);border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.lu-dlg h2{margin:0 0 6px;font-size:20px;line-height:1.25}
.lu-dlg p{margin:0 0 14px;color:var(--lu-mute);font-size:14px;line-height:1.45}
.lu-lbl{display:block;margin:14px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lu-mute)}
.lu-input{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--lu-line);background:var(--lu-bg);color:var(--lu-fg);font:600 18px var(--lu-mono);letter-spacing:.2em;text-transform:uppercase}
.lu-input.lu-text{font:15px var(--lu-font);letter-spacing:0;text-transform:none}
.lu-input::placeholder{color:#5f6e7c;letter-spacing:.1em}
.lu-row{display:flex;gap:8px;flex-wrap:wrap}
.lu-fs{border:0;margin:14px 0 0;padding:0;min-width:0}
.lu-fs legend{padding:0;margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lu-mute)}
.lu-opt{position:relative}
.lu-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.lu-opt span{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--lu-line);color:var(--lu-fg);font-size:14px}
.lu-opt input:checked+span{border-color:var(--lu-accent);background:rgba(94,200,216,.16);color:#fff;font-weight:600}
.lu-opt input:focus-visible+span{outline:2px solid var(--lu-accent);outline-offset:2px}
.lu-err{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--lu-bad)}
.lu-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.lu-btn{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--lu-accent);background:transparent;color:var(--lu-accent);font:600 14px var(--lu-font);cursor:pointer}
.lu-btn:hover{background:rgba(94,200,216,.14)}
.lu-btn.lu-primary{background:var(--lu-accent);color:#08141a}
.lu-btn.lu-primary:hover{background:#7fd6e3}
.lu-btn.lu-quiet{border-color:var(--lu-line);color:var(--lu-fg)}
.lu-root :focus-visible{outline:2px solid var(--lu-accent);outline-offset:2px}

.lu-chip{position:fixed;z-index:99990;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:calc(100vw - 16px);font:12px var(--lu-mono);color:var(--lu-fg);pointer-events:none}
.lu-chip>*{pointer-events:auto}
.lu-chip[data-pos="top-right"]{right:8px;top:8px}
.lu-chip[data-pos="top-left"]{left:8px;top:8px;align-items:flex-start}
.lu-chip[data-pos="bottom-right"]{right:8px;bottom:8px;flex-direction:column-reverse}
.lu-chip[data-pos="bottom-left"]{left:8px;bottom:8px;align-items:flex-start;flex-direction:column-reverse}
.lu-chip[data-pos="inline"]{position:static;display:inline-flex;align-items:flex-start}
.lu-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(20,26,33,.88);color:var(--lu-fg);border:1px solid var(--lu-line);font:11px var(--lu-mono);cursor:pointer;white-space:nowrap}
.lu-pill:hover{border-color:var(--lu-accent)}
.lu-panel{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--lu-panel);border:1px solid var(--lu-line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.lu-st{font-size:11px}
.lu-code{font-weight:700;letter-spacing:.14em;color:#fff}
.lu-dot{width:7px;height:7px;border-radius:50%;background:var(--lu-ok);flex:none}
.lu-chip[data-status="local"] .lu-dot{background:#e0a23c}
.lu-mute{color:var(--lu-mute)}
.lu-cbtn{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--lu-line);background:transparent;color:var(--lu-fg);font:12px var(--lu-font);cursor:pointer}
.lu-cbtn:hover{border-color:var(--lu-accent);color:var(--lu-accent)}
.lu-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:600px){.lu-w{display:none}}
@media(max-width:480px){.lu-dlg{padding:18px 16px 14px}}

</style>
<style>
/* chat-ui.css: JdaChat component. Uses the page theme variables with dark fallbacks. */
.jc{--jc-bg:var(--bg,#0f1318);--jc-panel:var(--panel,#192029);--jc-line:var(--line,#2c3744);--jc-fg:var(--fg,#e6edf3);--jc-mute:var(--mute,#93a1b0);--jc-acc:var(--accent,#5ec8d8);--jc-bad:var(--danger,#e5484d);--jc-ok:var(--ok,#46b37a);
  display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--jc-fg);font:400 14px/1.4 var(--font-b,var(--font,system-ui,sans-serif))}
.jc *{box-sizing:border-box}
.jc-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.jc-bar{display:flex;flex-wrap:wrap;gap:6px}
.jc-conv{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--jc-line);border-radius:999px;background:transparent;color:var(--jc-fg);cursor:pointer;font:700 12px var(--font-d,var(--font,system-ui,sans-serif));letter-spacing:.04em}
.jc-conv:hover{background:color-mix(in srgb,var(--jc-acc) 16%,transparent)}
.jc-conv.on{background:var(--jc-fg);color:var(--jc-bg);border-color:var(--jc-fg)}
.jc-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--jc-mute);flex:none}
.jc-dot.up{background:var(--jc-ok);border-color:var(--jc-ok)}
.jc-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--jc-bad);color:#fff;font:700 11px/18px var(--font-b,system-ui,sans-serif);text-align:center}
.jc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.jc-title{margin:0;font:700 13px var(--font-d,var(--font,system-ui,sans-serif));letter-spacing:.06em}
.jc-state{font-size:12px;color:var(--jc-mute)}
.jc-log{height:240px;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid var(--jc-line);border-radius:10px;background:color-mix(in srgb,var(--jc-bg) 60%,transparent)}
.jc-empty{margin:auto;font-size:12px;color:var(--jc-mute);text-align:center}
.jc-msg{max-width:88%;padding:6px 10px;border-radius:12px;border:1px solid var(--jc-line)}
.jc-msg.me{align-self:flex-end;background:color-mix(in srgb,var(--jc-acc) 22%,transparent)}
.jc-msg.them{align-self:flex-start;background:color-mix(in srgb,var(--jc-fg) 8%,transparent)}
.jc-meta{font-size:11px;color:var(--jc-mute);margin-bottom:2px}
.jc-auto{margin-left:6px;padding:0 6px;border:1px dashed var(--jc-mute);border-radius:999px}
.jc-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.jc-row{display:flex;gap:8px;align-items:flex-end}
.jc-input{flex:1;min-width:0;min-height:38px;max-height:96px;padding:8px 10px;resize:none;border:1px solid var(--jc-line);border-radius:10px;background:var(--jc-panel);color:var(--jc-fg);font:inherit}
.jc-input:disabled{opacity:.55}
.jc-send{min-height:38px;padding:0 16px;border:1px solid var(--jc-acc);border-radius:999px;background:var(--jc-acc);color:#06222a;cursor:pointer;font:700 12px var(--font-d,var(--font,system-ui,sans-serif));letter-spacing:.06em}
.jc-send:disabled{opacity:.45;cursor:not-allowed}
.jc-count{text-align:right;font-size:11px;color:var(--jc-mute)}
.jc button:focus-visible,.jc textarea:focus-visible,.jc-log:focus-visible{outline:2px solid var(--jc-acc);outline-offset:2px}
@media (max-width:640px){.jc-log{height:200px}.jc-input{font-size:16px}}
@media (prefers-reduced-motion:reduce){.jc *{transition:none!important}}

</style>
</head>
<body>
<header class="eh">
  <div>
    <h1>Earth Mission Control</h1>
    <p class="sub">Interplanetary Survival Guide · Jezero Delta · Mission control</p>
  </div>
</header>
<section id="banner" class="banner" role="alert" hidden></section>
<main class="cols">
  <section aria-labelledby="h-alerts">
    <h2 class="sec" id="h-alerts">Incoming alerts</h2>
    <p id="empty" class="empty">No alerts. Waiting for a crew member to press SOS.</p>
    <ul id="alerts" class="alerts" aria-live="polite"></ul>
  </section>
  <section aria-labelledby="h-reports" class="wide">
    <h2 class="sec" id="h-reports">Reports <span id="reports-badge" class="cbadge" hidden></span></h2>
    <p id="reports-empty" class="empty">No reports yet. Crew reports sent from the planner appear here.</p>
    <div id="reports" class="reports"></div>
  </section>
  <section aria-labelledby="h-chat">
    <h2 class="sec" id="h-chat">Crew chat <span id="chat-badge" class="cbadge" hidden></span></h2>
    <div id="chat"></div>
  </section>
</main>
<script>
/* Optional online link between the Mars base page and the Earth control page.
   Leave empty to use the same-browser link (two tabs of one browser). See docs/LINK.md. */
window.JDA_LINK = { url: '', key: '', table: 'link_messages' };

</script>
<script>
/* link.js: JdaLink v2, message / state / presence link between pages, isolated by ROOM CODE. Exposes window.JdaLink.
   Transports (see docs/LINK.md): relay (same-origin /api, server/relay.py, works across devices on one network),
   online (Supabase, only if web/data/link-config.js is filled in), local (BroadcastChannel + localStorage, same browser).
   Everything received is untrusted data and is validated. Messages never cross rooms. */
(function () {
  'use strict';
  var CODE_RE = /^[A-HJ-NP-Z2-9]{5}$/, LEGACY = 'LOCAL', ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var MAX_MSG = 4096, MAX_STATE = 65536, HEARTBEAT = 5000, ONLINE_MS = 15000, POLL_MS = 900, LOG_N = 100;
  var ROLES = ['crew', 'earth', 'control', 'helmet', 'tablet', 'legacy'];
  var cfg = window.JDA_LINK || {};
  var cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 9);   // this page load
  var subs = [], statusSubs = [], presSubs = [], stateSubs = {};
  var room = null, status = 'local', S = null, implicit = false, pendingOut = { msgs: [], state: {} };   // pendingOut: what an implicit (LOCAL) room sent, replayed into the first explicit room   // S = per-join session (timers, seen, log, state, presence)

  /* ---------- helpers ---------- */
  function slug(s, n) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, n || 24); }
  function cleanName(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 24); }
  function normCode(c) { return String(c == null ? '' : c).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function validCode(c) { return CODE_RE.test(c) || c === LEGACY; }
  function newCode() {
    var out = '', a = new Uint8Array(5);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 5; i++) a[i] = Math.floor(Math.random() * 256); }
    for (var j = 0; j < 5; j++) out += ALPHA.charAt(a[j] % ALPHA.length);
    return out;
  }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 5); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function size(o) { try { return JSON.stringify(o).length; } catch (e) { return Infinity; } }
  function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
  function safeKey(k) { return typeof k === 'string' && /^[A-Za-z0-9:_.-]{1,64}$/.test(k) && k !== '__proto__'; }
  function warn() { if (window.console) console.warn.apply(console, ['JdaLink'].concat([].slice.call(arguments))); }
  function call(fn, a, b) { try { fn(a, b); } catch (e) { if (window.console) console.error('JdaLink handler failed', e); } }

  function cleanFrom(f) {
    if (!isObj(f)) return null;
    var role = typeof f.role === 'string' && ROLES.indexOf(f.role) >= 0 ? f.role : '';
    if (!role) return null;
    return { role: role, id: slug(f.id, 32), name: cleanName(f.name), cid: typeof f.cid === 'string' ? f.cid.slice(0, 40) : '' };
  }
  /* validate an incoming message for the current room; returns a clean copy or null */
  function validMsg(m, code) {
    if (!isObj(m) || size(m) > MAX_MSG) return null;
    if (typeof m.id !== 'string' || !m.id || m.id.length > 64 || typeof m.type !== 'string' || !/^[A-Za-z0-9_.-]{1,32}$/.test(m.type)) return null;
    if (m.room !== code) return null;
    var from = cleanFrom(m.from);
    if (!from) return null;
    var c = clone(m);
    c.from = from;
    delete c.seq; delete c.replay;
    if (typeof c.t !== 'string' || isNaN(Date.parse(c.t))) return null;
    if (c.type === 'chat') {
      if (typeof c.text !== 'string') return null;
      c.text = c.text.slice(0, 500);
    }
    return c;
  }
  function validEntry(e) {
    if (!isObj(e) || !('value' in e) || size(e.value) > MAX_STATE) return null;
    var from = cleanFrom(e.from) || { role: 'legacy', id: '', name: '', cid: '' };
    return { value: clone({ v: e.value }).v, t: isFinite(Number(e.t)) ? Number(e.t) : Date.now(), from: from, ver: isFinite(Number(e.ver)) ? Number(e.ver) : 0 };
  }

  /* ---------- session ---------- */
  function newSession(code) {
    return { code: code, seen: {}, seenQ: [], log: [], state: {}, relayVer: {}, pres: {}, timers: [], bc: null, listeners: [], relay: false, online: false, relayFails: 0, since: 0, stateVer: 0, closed: false, synced: false };
  }
  function markSeen(id) { S.seen[id] = 1; S.seenQ.push(id); if (S.seenQ.length > 3000) delete S.seen[S.seenQ.shift()]; }
  function setStatus(s) { if (s === status) return; status = s; statusSubs.slice().forEach(function (fn) { call(fn, s); }); }
  function pushLog(m) { S.log.push(m); if (S.log.length > LOG_N) S.log.shift(); }

  /* incoming message from any transport; `replay` marks backlog fetched at join */
  function deliver(raw, replay) {
    if (!S || S.closed) return;
    var m = validMsg(raw, S.code);
    if (!m || S.seen[m.id]) return;
    markSeen(m.id);
    pushLog(m);
    if (m.from.cid && m.from.cid === cid) return;   // never echo to the sender
    var out = m;
    if (replay) { out = clone(m); out.replay = true; }
    subs.slice().forEach(function (fn) { call(fn, out); });
  }
  function applyState(key, raw, viaRelay) {
    if (!S || S.closed || !safeKey(key)) return;
    var e = validEntry(raw);
    if (!e) return;
    var cur = S.state[key];
    if (viaRelay) { if (e.ver && e.ver <= (S.relayVer[key] || 0)) return; S.relayVer[key] = e.ver; }
    else if (cur && e.t <= cur.t) return;
    var changed = !cur || cur.t !== e.t || cur.from.cid !== e.from.cid;
    S.state[key] = e;
    if (changed && e.from.cid !== cid) fireState(key);
  }
  function fireState(key) {
    var e = S.state[key];
    (stateSubs[key] || []).slice().forEach(function (fn) { call(fn, clone({ v: e.value }).v, { t: e.t, from: e.from }); });
  }

  /* ---------- local transport (BroadcastChannel + localStorage, namespaced by room) ---------- */
  var P = 'jda.link.';
  function k(code, what) { return P + code + '.' + what; }
  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, v) { try { localStorage.setItem(key, v); return true; } catch (e) { return false; } }
  function readLocalLog(code) {
    try { var a = JSON.parse(lsGet(k(code, 'log')) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function startLocal() {
    var code = S.code, ses = S;
    readLocalLog(code).forEach(function (m) { var v = validMsg(m, code); if (v && !ses.seen[v.id]) { markSeen(v.id); pushLog(v); } });
    try {
      var pre = k(code, 'state.');
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf(pre) === 0) { try { applyState(key.slice(pre.length), JSON.parse(localStorage.getItem(key)), false); } catch (e) { /* ignore */ } }
      }
    } catch (e) { /* ignore */ }
    try {
      if (window.BroadcastChannel) {
        ses.bc = new BroadcastChannel('jda-link:' + code);
        ses.bc.onmessage = function (ev) { if (ev.data && ev.data.k === 'msg') deliver(ev.data.m); else if (ev.data && ev.data.k === 'state') applyState(ev.data.key, ev.data.e, false); };
      }
    } catch (e) { ses.bc = null; }
    function onStorage(e) {
      if (!e.key || !e.newValue) return;
      try {
        if (e.key === k(code, 'msg')) deliver(JSON.parse(e.newValue));
        else if (e.key.indexOf(k(code, 'state.')) === 0) applyState(e.key.slice(k(code, 'state.').length), JSON.parse(e.newValue), false);
      } catch (err) { /* ignore corrupt */ }
    }

/* chat-ui.js: reusable person-to-person chat. window.JdaChat.mount(container, opts) -> api.

/* earth.js: Earth control view. Shows SOS alerts sent by the Mars base page through JdaLink.

  var list = document.getElementById('alerts'), empty = document.getElementById('empty'),

  if (window.JdaLinkUI) window.JdaLinkUI.mount({ role: 'earth', ask: ['code'] });

      var h = el('h3'); h.appendChild(el('span', 'status', a.ackAt ? '■ ACKNOWLEDGED' : '▲ ACTIVE'));

  function addReport(m) {
    if (m.to && m.to !== 'earth') return;
    var key = typeof m.reportId === 'string' && m.reportId ? m.reportId.slice(0, 60) : m.id;
    if (!key || reports[key]) return;
    var f = m.from && typeof m.from === 'object' ? m.from : {};
    reports[key] = { key: key, from: name(m.from && f.name || m.fromName || (typeof m.from === 'string' ? m.from : '') || f.id),
      t: m.at || m.t, subject: String(m.subject == null ? '' : m.subject).replace(/\s+/g, ' ').trim().slice(0, 120) || '(no subject)',
      body: String(m.body == null ? '' : m.body).replace(/\r\n?/g, '\n').slice(0, 4000), misses: num(m.misses), seen: false };
    rOrder.push(key);
    if (!loading) { rUnread++; renderReports(); }
  }
  function renderReports() {
    rEmpty.hidden = rOrder.length > 0;
    rList.textContent = '';
    rOrder.slice().sort(function (a, b) { return String(reports[b].t).localeCompare(String(reports[a].t)); }).forEach(function (k) {
      var r = reports[k], d = el('details', 'report' + (r.seen ? '' : ' fresh'));
      var s = el('summary'); s.appendChild(el('span', 'rsub', r.subject));
      s.appendChild(el('span', 'rmeta', r.from + ' · ' + when(r.t) + (r.misses ? ' · ' + r.misses + ' missed' : '')));
      d.appendChild(s); d.appendChild(el('pre', 'rbody', r.body || '(empty report)'));
      d.open = !!r.open;
      d.addEventListener('toggle', function () { r.open = d.open; if (d.open && !r.seen) { r.seen = true; d.classList.remove('fresh'); rUnread = Math.max(0, rUnread - 1); badge(); } });
      rList.appendChild(d);
    });
    badge();
  }
  function badge() { rBadge.hidden = !rUnread; rBadge.textContent = rUnread > 9 ? '9+' : String(rUnread); }

  function handle(m) {
    if (m.type === 'sos') {
      if (alerts[m.id]) return;
      alerts[m.id] = { id: m.id, from: sender(m), lat: num(m.lat), lon: num(m.lon), t: m.t, ackAt: null };
      order.push(m.id);
    } else if (m.type === 'report') { addReport(m); return;
    } else if (m.type === 'ack' && alerts[m.sosId]) {
      alerts[m.sosId].ackAt = m.t;
    } else return;
    render();
  }

  var loadedFor = null;
  function roomKey() { var r = window.JdaLink.room; return r ? r.code : null; }
  function loadHistory() {
    loadedFor = roomKey();
    if (!loadedFor) return;
    loading = true; reports = {}; rOrder = []; rUnread = 0;
    (window.JdaLink.history(200) || []).forEach(handle);   // alerts and reports sent before this page was opened
    loading = false; rUnread = rOrder.length; renderReports();
  }
  window.JdaLink.on(handle);
  loadHistory();
  setInterval(function () {   // room joined or changed after load: drop alerts of the old room, read the new one's history
    if (roomKey() === loadedFor) return;
    alerts = {}; order = []; loadHistory(); render();
  }, 1000);
  render();

  // chat with the crew (JdaChat, person to person; no automatic replies)
  var chatBox = document.getElementById('chat');
  function crewPeers() {
    var out = [];
    function add(id, nm) { id = String(id || ''); if (id && id !== 'earth' && id !== 'legacy' && !out.some(function (q) { return q.id === id; })) out.push({ id: id, name: nm || id }); }
    try { if (!window.JdaLink.room) return out;
      var w = window.JdaLink.getState && window.JdaLink.getState('world');   // crew known from the shared world, even when offline
      if (w && w.value && w.value.crew) Object.keys(w.value.crew).forEach(function (k) { var r = w.value.crew[k]; if (r) add(r.id || k, r.name); });
      (window.JdaLink.history(200) || []).forEach(function (m) {            // anyone seen in the room's history
        var f = m && m.from; if (f && typeof f === 'object' && f.role !== 'earth' && f.role !== 'control' && f.role !== 'legacy') add(f.id, f.name);
      });
      (window.JdaLink.presence() || []).forEach(function (p) {
      if (p && p.id && p.role !== 'earth' && p.role !== 'control' && p.role !== 'legacy' && !out.some(function (q) { return q.id === p.id; })) out.push({ id: p.id, name: p.name || p.id });
    }); } catch (e) { /* no presence yet */ }
    return out;
  }
  if (window.JdaChat && chatBox) {
    var chat = window.JdaChat.mount(chatBox, { link: window.JdaLink, meId: 'earth', meName: 'Earth control', peers: crewPeers, allowEarth: false });
    var chatBadge = document.getElementById('chat-badge'), base = document.title;
    chat.onUnread(function (total) {
      chatBadge.hidden = !total; chatBadge.textContent = total > 9 ? '9+' : String(total);
      if (!total && !/SOS/.test(document.title)) document.title = 'Earth Mission Control';
    });
  }
})();

</script>
</body>
